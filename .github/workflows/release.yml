name: Release & Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate Generated APK
        id: apk_location
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          VERSION="${{ github.ref_name || inputs.tag_name }}"
          CLEAN_VER="${VERSION#v}"
          echo "RELEASE_TAG=$VERSION" >> $GITHUB_ENV
          echo "Extracting release notes for version $CLEAN_VER from CHANGELOG.md..."
          python3 -c "
          import re
          from pathlib import Path

          changelog_path = Path('CHANGELOG.md')
          if changelog_path.exists():
              changelog = changelog_path.read_text(encoding='utf-8')
              pattern = r'## \[' + re.escape('$CLEAN_VER') + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, changelog, re.DOTALL)
              notes = match.group(1).strip() if match else 'AutoUSB Release $VERSION'
          else:
              notes = 'AutoUSB Release $VERSION'
          
          Path('RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: AutoUSB Release ${{ github.ref_name || inputs.tag_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.APK_FILE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
